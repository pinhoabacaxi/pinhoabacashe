plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

group = 'com.github.maxrave-dev'
version = '0.0.7'

android {
    namespace 'com.maxrave.kotlinyoutubeextractor'

    // Sincronizado com o app principal (34 ou 35 conforme sua preferência, 
    // mas devem ser compatíveis)
    compileSdk 34 

    defaultConfig {
        minSdk 24
        targetSdk 34

        consumerProguardFiles 'consumer-rules.pro'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    // Motor JS para decifrar a Signature Cipher do YouTube
    // Atualizado para a versão que usamos no app principal para evitar conflitos
    implementation('com.github.evgenyneu:js-evaluator-for-android:v6.0.0') {
        exclude group: 'com.android.support'
    }
    
    // Kotlin Coroutines (Essencial para as funções suspend do YTExtractor)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // Android KTX e AppCompat
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    
    // Testes
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.maxrave-dev'
                artifactId = 'kotlin-youtubeExtractor'
                version = '0.0.7'
            }
        }
    }
}
